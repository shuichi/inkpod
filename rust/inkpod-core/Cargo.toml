[package]
name = "inkpod-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-support = []

[dependencies]
blake3 = { version = "=1.8.5", default-features = false, features = ["std"] }
inkpod-format = { path = "../inkpod-format" }
inkpod-image = { path = "../inkpod-image" }
inkpod-io = { path = "../inkpod-io" }

[dev-dependencies]
inkpod-io = { path = "../inkpod-io", features = ["test-support"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
syn = { version = "2.0.119", default-features = false, features = ["full", "parsing"] }

[[bench]]
name = "core_workflows"
harness = false

[lints]
workspace = true
