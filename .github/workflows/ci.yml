name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - if: matrix.os == 'ubuntu-latest'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --package inkpod-core --all-features --no-deps
      - if: matrix.os == 'ubuntu-latest'
        run: cargo bench -p inkpod-image --bench large_document -- --quick
      - if: matrix.os == 'ubuntu-latest'
        run: cargo bench -p inkpod-core --bench core_workflows -- --quick

  windows:
    name: Windows (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: windows-x64-debug
            runner: windows-2025-vs2026
            architecture: x64
          - preset: windows-x64-release
            runner: windows-2025-vs2026
            architecture: x64
          - preset: windows-arm-debug
            runner: windows-11-vs2026-arm
            architecture: arm64
          - preset: windows-arm-release
            runner: windows-11-vs2026-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.architecture }}
      - name: Verify Visual Studio 2026 toolchain
        shell: pwsh
        run: |
          if ($env:VisualStudioVersion -notlike '18.*') {
            throw "Expected Visual Studio 2026, got '$env:VisualStudioVersion'"
          }
          where.exe cl
      - run: cmake --preset ${{ matrix.preset }} -DINKPOD_BUILD_NUMBER=${{ github.run_number }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - name: Verify unchanged build does not rebuild Rust or packages
        shell: pwsh
        run: |
          $output = cmake --build --preset ${{ matrix.preset }} --verbose 2>&1
          $output
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($output -match 'Building inkpod-ffi Rust static library') {
            throw 'unchanged build rebuilt the Rust static library'
          }
          if ($output -match 'Assembling unsigned inkpod MSIX') {
            throw 'unchanged build rebuilt the MSIX package'
          }
          if ($output -match 'Assembling inkpod portable ZIP') {
            throw 'unchanged build rebuilt the portable ZIP package'
          }
          if ($output -match 'Verifying static MSVC CRT linkage') {
            throw 'unchanged build repeated the static CRT verification'
          }
      - run: ctest --preset ${{ matrix.preset }}

  macos-arm64:
    name: macOS 26 arm64 release gate
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin
      - name: Verify native Tahoe and Xcode environment
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          xcodebuild -version
      - name: Run every automated macOS release profile
        env:
          INKPOD_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/macOS.sh verify
