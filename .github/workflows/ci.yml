name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - if: matrix.os == 'ubuntu-latest'
        run: cargo bench -p inkpod-image --bench large_document -- --quick
      - if: matrix.os == 'ubuntu-latest'
        run: cargo bench -p inkpod-core --bench core_workflows -- --quick

  windows:
    name: Windows (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-x64-debug, windows-x64-release]
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Verify Visual Studio 2026 toolchain
        shell: pwsh
        run: |
          if ($env:VisualStudioVersion -notlike '18.*') {
            throw "Expected Visual Studio 2026, got '$env:VisualStudioVersion'"
          }
          where.exe cl
      - name: Verify private Windows file I/O backend
        run: cargo test --locked --package inkpod-io --all-features
      - run: cmake --preset ${{ matrix.preset }} -DINKPOD_BUILD_NUMBER=${{ github.run_number }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - name: Verify unchanged build does not rebuild Rust or packages
        shell: pwsh
        run: |
          $output = cmake --build --preset ${{ matrix.preset }} --verbose 2>&1
          $output
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($output -match 'Building inkpod-ffi Rust static library') {
            throw 'unchanged build rebuilt the Rust static library'
          }
          if ($output -match 'Assembling unsigned inkpod MSIX') {
            throw 'unchanged build rebuilt the MSIX package'
          }
          if ($output -match 'Assembling inkpod portable ZIP') {
            throw 'unchanged build rebuilt the portable ZIP package'
          }
          if ($output -match 'Verifying static MSVC CRT linkage') {
            throw 'unchanged build repeated the static CRT verification'
          }
      - run: ctest --preset ${{ matrix.preset }}
