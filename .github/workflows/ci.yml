name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - if: matrix.os == 'ubuntu-latest'
        run: cargo bench -p inkpod-image --bench large_document -- --quick

  windows:
    name: Windows (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-x64-debug, windows-x64-release]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - name: Verify unchanged build does not rebuild Rust or MSIX
        shell: pwsh
        run: |
          $output = cmake --build --preset ${{ matrix.preset }} --verbose 2>&1
          $output
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($output -match 'Building inkpod-ffi Rust static library') {
            throw 'unchanged build rebuilt the Rust static library'
          }
          if ($output -match 'Assembling unsigned inkpod MSIX') {
            throw 'unchanged build rebuilt the MSIX package'
          }
      # GitHub's hosted image is Windows Server 2022. The elevated package
      # install/uninstall acceptance runs separately on a Windows 11 workstation.
      - run: ctest --preset ${{ matrix.preset }} -E inkpod_windows_msix_install_uninstall_smoke
